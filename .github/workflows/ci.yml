name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets deploy-ssh-docker.yml gate deployment on the same checks.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Add the stack's toolchain setup here (before scripts/check.sh), e.g. for Node:
      #   - uses: pnpm/action-setup@v4
      #   - uses: actions/setup-node@v6
      #     with: { node-version-file: .nvmrc, cache: pnpm }
      #   - run: pnpm install --frozen-lockfile

      - name: Run checks
        run: scripts/check.sh

  commit-messages:
    # Only on push/PR; skipped when called from the deploy workflow.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Commit messages are English
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -q '^0*$'; then
            range="$BEFORE..$GITHUB_SHA"
          else
            range="$GITHUB_SHA"  # new branch: check every reachable commit
          fi
          scripts/check-commit-msg.sh --range "$range"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Free for personal accounts; organization-owned repos need GITLEAKS_LICENSE.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
